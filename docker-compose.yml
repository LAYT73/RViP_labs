services:
  postgres:
    image: postgres:16-alpine
    container_name: rvip-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-students}
      POSTGRES_USER: ${DB_USER:-students}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-students}
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-students} -d ${DB_NAME:-students}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rvip-net

  liquibase:
    image: liquibase/liquibase:4.31
    container_name: rvip-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USER: ${DB_USER:-students}
      DB_PASSWORD: ${DB_PASSWORD:-students}
      DB_NAME: ${DB_NAME:-students}
    volumes:
      - ./liquibase/changelog:/liquibase/changelog
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        lpm add postgresql --global
        liquibase \
          --url=jdbc:postgresql://postgres:5432/$${DB_NAME} \
          --username=$${DB_USER} \
          --password=$${DB_PASSWORD} \
          --changelog-file=db.changelog-master.yaml \
          --search-path=/liquibase/changelog \
          update
    networks:
      - rvip-net

  student-service:
    build:
      context: .
      dockerfile: apps/student-service/Dockerfile
    container_name: rvip-student-service
    depends_on:
      liquibase:
        condition: service_completed_successfully
    environment:
      PORT: ${STUDENT_PORT:-3001}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-students}
      DB_PASSWORD: ${DB_PASSWORD:-students}
      DB_NAME: ${DB_NAME:-students}
    ports:
      - "${STUDENT_HOST_PORT:-3001}:${STUDENT_PORT:-3001}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3001)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - rvip-net

  report-service-1:
    build:
      context: .
      dockerfile: apps/report-service/Dockerfile
    container_name: rvip-report-service-1
    depends_on:
      liquibase:
        condition: service_completed_successfully
    environment:
      PORT: ${REPORT_PORT:-3002}
      INSTANCE_ID: report-1
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-students}
      DB_PASSWORD: ${DB_PASSWORD:-students}
      DB_NAME: ${DB_NAME:-students}
    ports:
      - "${REPORT_HOST_PORT_1:-3002}:${REPORT_PORT:-3002}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3002)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - rvip-net

  report-service-2:
    build:
      context: .
      dockerfile: apps/report-service/Dockerfile
    container_name: rvip-report-service-2
    depends_on:
      liquibase:
        condition: service_completed_successfully
    environment:
      PORT: ${REPORT_PORT:-3002}
      INSTANCE_ID: report-2
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-students}
      DB_PASSWORD: ${DB_PASSWORD:-students}
      DB_NAME: ${DB_NAME:-students}
    ports:
      - "${REPORT_HOST_PORT_2:-3003}:${REPORT_PORT:-3002}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3002)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - rvip-net

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: rvip-gateway
    depends_on:
      student-service:
        condition: service_healthy
      report-service-1:
        condition: service_healthy
      report-service-2:
        condition: service_healthy
    environment:
      PORT: ${GATEWAY_PORT:-3000}
      STUDENT_SERVICE_URL: http://student-service:${STUDENT_PORT:-3001}
      REPORT_SERVICE_URLS: http://report-service-1:${REPORT_PORT:-3002},http://report-service-2:${REPORT_PORT:-3002}
    ports:
      - "${GATEWAY_HOST_PORT:-3080}:${GATEWAY_PORT:-3000}"
    networks:
      - rvip-net

volumes:
  postgres_data:

networks:
  rvip-net:
    name: rvip-net
