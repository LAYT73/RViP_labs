services:
  postgres:
    image: postgres:16-alpine
    container_name: rvip-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-students}
      POSTGRES_USER: ${DB_USER:-students}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-students}
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-students} -d ${DB_NAME:-students}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rvip-net

  liquibase:
    image: liquibase/liquibase:4.31
    container_name: rvip-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USER: ${DB_USER:-students}
      DB_PASSWORD: ${DB_PASSWORD:-students}
      DB_NAME: ${DB_NAME:-students}
    volumes:
      - ./liquibase/changelog:/liquibase/changelog
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        lpm add postgresql --global
        liquibase \
          --url=jdbc:postgresql://postgres:5432/$${DB_NAME} \
          --username=$${DB_USER} \
          --password=$${DB_PASSWORD} \
          --changelog-file=db.changelog-master.yaml \
          --search-path=/liquibase/changelog \
          update
    networks:
      - rvip-net

  # --- ELK / observability (lab-3 доп) ---
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.4
    container_name: rvip-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "${ELASTICSEARCH_HOST_PORT:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - rvip-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.4
    container_name: rvip-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
    ports:
      - "${KIBANA_HOST_PORT:-5601}:5601"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -o /dev/null -w '%{http_code}' http://localhost:5601/api/status | grep -q 200",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - rvip-net

  apm-server:
    image: docker.elastic.co/apm/apm-server:8.11.4
    container_name: rvip-apm-server
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "${APM_HOST_PORT:-8200}:8200"
    command:
      - apm-server
      - -e
      - -E
      - apm-server.host=0.0.0.0:8200
      - -E
      - output.elasticsearch.hosts=["elasticsearch:9200"]
      - -E
      - setup.kibana.host=kibana:5601
      - -E
      - apm-server.kibana.enabled=true
      - -E
      - apm-server.kibana.host=kibana:5601
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -o /dev/null -w '%{http_code}' http://localhost:8200/ | grep -q 200",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - rvip-net

  student-service:
    build:
      context: .
      dockerfile: apps/student-service/Dockerfile
    container_name: rvip-student-service
    depends_on:
      liquibase:
        condition: service_completed_successfully
      report-service:
        condition: service_healthy
      apm-server:
        condition: service_healthy
    environment:
      PORT: ${STUDENT_PORT:-3001}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-students}
      DB_PASSWORD: ${DB_PASSWORD:-students}
      DB_NAME: ${DB_NAME:-students}
      REPORT_SERVICE_URL: http://report-service:${REPORT_PORT:-3002}
      ELASTIC_APM_SERVICE_NAME: student-service
      ELASTIC_APM_SERVER_URL: http://apm-server:8200
      ELASTIC_APM_ACTIVE: ${ELASTIC_APM_ACTIVE:-true}
    ports:
      - "${STUDENT_HOST_PORT:-3001}:${STUDENT_PORT:-3001}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3001)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks:
      - rvip-net

  report-service:
    build:
      context: .
      dockerfile: apps/report-service/Dockerfile
    container_name: rvip-report-service
    depends_on:
      liquibase:
        condition: service_completed_successfully
      apm-server:
        condition: service_healthy
    environment:
      PORT: ${REPORT_PORT:-3002}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-students}
      DB_PASSWORD: ${DB_PASSWORD:-students}
      DB_NAME: ${DB_NAME:-students}
      ELASTIC_APM_SERVICE_NAME: report-service
      ELASTIC_APM_SERVER_URL: http://apm-server:8200
      ELASTIC_APM_ACTIVE: ${ELASTIC_APM_ACTIVE:-true}
    expose:
      - "${REPORT_PORT:-3002}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3002)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - rvip-net

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: rvip-gateway
    depends_on:
      student-service:
        condition: service_healthy
      apm-server:
        condition: service_healthy
    environment:
      PORT: ${GATEWAY_PORT:-3000}
      STUDENT_SERVICE_URL: http://student-service:${STUDENT_PORT:-3001}
      ELASTIC_APM_SERVICE_NAME: gateway
      ELASTIC_APM_SERVER_URL: http://apm-server:8200
      ELASTIC_APM_ACTIVE: ${ELASTIC_APM_ACTIVE:-true}
    ports:
      - "${GATEWAY_HOST_PORT:-3080}:${GATEWAY_PORT:-3000}"
    networks:
      - rvip-net

volumes:
  postgres_data:
  es_data:

networks:
  rvip-net:
    name: rvip-net
