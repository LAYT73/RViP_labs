databaseChangeLog:
  - changeSet:
      id: 002-add-academic-leave-status
      author: shipilov
      comment: >
        Production-safe extension of students.status: drop the old CHECK
        (ENROLLED, EXPELLED) and recreate it with ACADEMIC_LEAVE. Do not
        edit 001-create-students — existing DBs already applied it.
        Uses raw SQL because drop/addCheckConstraint require Liquibase Pro.
      changes:
        - sql:
            sql: |
              ALTER TABLE students DROP CONSTRAINT students_status_check;
              ALTER TABLE students
                ADD CONSTRAINT students_status_check
                CHECK (status IN ('ENROLLED', 'EXPELLED', 'ACADEMIC_LEAVE'));
